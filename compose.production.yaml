services:
  frontend:
    image: taskflow-frontend:local
    expose:
      - '3000'
    ports:
      - '3000:3000'
    depends_on:
      - backend

  backend:
    image: taskflow-backend:local
    expose:
      - '3000'
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/taskflow
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini}
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

networks:
  default:
    driver: bridge
